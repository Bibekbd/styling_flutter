name: minimilist
description: A minimalist Flutter UI widget package inspired by Milligram (milligram.com) - a malleable HTML/CSS framework. Brings Milligram's clean, typographic, grid-based design language to Flutter as ready-to-use widgets and themes.
version: 1.0.0
homepage: https://github.com/milligram/milligram
repository: https://github.com/milligram/milligram

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
